name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  WGPU_BACKEND: vulkan
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  rust:
    name: Rust Build & Test (1.91)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless Vulkan / Mesa system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libvulkan1 \
            mesa-vulkan-drivers \
            libegl1 \
            libgl1-mesa-dri

      - name: Install Rust 1.91 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.91-

      - name: Build Rust workspace
        run: cargo build --workspace

      - name: Run Rust workspace test suite
        run: cargo test --workspace --no-fail-fast

  clippy:
    name: Rust Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless Vulkan / Mesa system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libvulkan1 \
            mesa-vulkan-drivers \
            libegl1 \
            libgl1-mesa-dri

      - name: Install Rust 1.91 toolchain with clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-1.91-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-1.91-
            ${{ runner.os }}-cargo-1.91-

      - name: Run cargo clippy across workspace and all targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: Web Studio Lint & Tests
    runs-on: ubuntu-latest
    # Currently 25 of 26 tests pass and 1 fails (`AssertionError: 5 !== 4` in Test 17
    # `FEA_QUICK_LOAD_PRESETS.length`, tracked as TS-FIX-01). Keep `continue-on-error: true` until fixed.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript typecheck (lint)
        run: npm run lint

      - name: Run TypeScript CAD engine tests
        run: npx tsx --test src/cad/cad_engine.test.ts
