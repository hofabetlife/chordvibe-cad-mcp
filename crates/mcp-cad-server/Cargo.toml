[package]
name = "mcp-cad-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "mcp_cad_server"
path = "src/lib.rs"

[[bin]]
name = "mcp-cad-server"
path = "src/main.rs"

[dependencies]
mcp-cad-core = { path = "../mcp-cad-core" }
mcp-cad-physics = { path = "../mcp-cad-physics" }
mcp-cad-fea = { path = "../mcp-cad-fea" }
mcp-cad-viewer = { path = "../mcp-cad-viewer" }
winit = "0.30"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["tokio"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
