[package]
name = "mcp-cad-core"
version = "0.1.0"
edition = "2021"
authors = ["MCP-CAD Contributors"]
description = "Core geometry kernel, parametric DAG, material library, and STL exporter for MCP-CAD"
license = "MIT OR Apache-2.0"

[dependencies]
nalgebra = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
